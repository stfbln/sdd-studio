// Order management API of the Acme shop.
// Generated clients use the go_package below.

syntax = "proto3";

package acme.orders.v1;

import "common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/acme/shop/gen/orders/v1;ordersv1";
option java_multiple_files = true;

// Places and follows customer orders.
service OrderService {
  // Creates an order from the customer's cart.
  rpc CreateOrder(CreateOrderRequest) returns (Order);

  // Returns one order.
  rpc GetOrder(GetOrderRequest) returns (Order) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Streams status changes of an order until it is delivered.
  rpc WatchOrder(GetOrderRequest) returns (stream OrderEvent);
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated Order.Line lines = 2;
  map<string, string> metadata = 3; // free-form labels
}

message GetOrderRequest {
  string order_id = 1;
}

// A customer order.
message Order {
  reserved 4, 8 to 10;
  reserved "legacy_total";

  // One product of the order.
  message Line {
    string sku = 1;
    int32 quantity = 2;
    acme.common.v1.Money unit_price = 3;
  }

  string id = 1;
  Status status = 2;
  repeated Line lines = 3;
  google.protobuf.Timestamp created_at = 5;
  string note = 6 [deprecated = true];

  oneof payment {
    string card_token = 11;
    string voucher_code = 12;
  }
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_PAID = 2;
  STATUS_SHIPPED = 3;
  STATUS_DELIVERED = 4;
}

message OrderEvent {
  string order_id = 1;
  Status status = 2;
  google.protobuf.Timestamp at = 3;
}
