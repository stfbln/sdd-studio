# Sample specification for the SDD OpenAPI form editor.
openapi: 3.0.3
info:
  title: Pet Store API
  version: 1.0.0
  description: |
    Manage the pets of the store.
    Comments in this file are kept when you edit it through the form.
servers:
  - url: https://api.petstore.example.com/v1
    description: Production
tags:
  - name: pets
    description: Everything about pets
paths:
  /pets:
    get:
      summary: List pets
      operationId: listPets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: A page of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          description: Unexpected error
    post:
      summary: Create a pet
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        201:
          description: Created
  /pets/{petId}:
    get:
      summary: Get a pet
      operationId: getPet
      tags: [pets]
      responses:
        200:
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        404:
          description: Not found
      parameters: []
    parameters:
      - name: petId
        in: path
        schema:
          type: string
        required: true
        description: "The ID of the pet"
components:
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display name
        status:
          type: string
          enum: [available, pending, sold]
    Pet:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        owner:
          type: string
      description: A pet
      required:
        - name
        - status
        - owner
