# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
# How to update this file (for people and AI assistants): a Backstage software catalog file, one
#   entity per YAML document separated by ---, see
#   https://backstage.io/docs/features/software-catalog/descriptor-format.
# - Purpose: The entry point: what exists, who owns it, how it fits together and which files
#   describe each entity. What belongs in other files:
#   - Interface details: the API definition files (OpenAPI, AsyncAPI, Protocol Buffers, OpenCLI).
#   - Behaviour: Gherkin features. Threats and mitigations: threat models.
#   - Any other requirement: the markdown spec linked to the entity.
# - Keep every entity valid against the JSON schema of the first line (apiVersion
#   backstage.io/v1alpha1).
# - Refer to entities as [kind:][namespace/]name; dependsOn and dependencyOf entries need the kind
#   (e.g. resource:orders-db). Referenced entities may be defined in any *.catalog-info.yaml file of
#   the workspace.
# - SDD Studio conventions (paths are relative to this file; lists are comma separated):
#   - sdd-studio/specs and sdd-studio/threat-models annotations: spec files and Open Threat Model
#     files an entity implements or follows. An API's definition is its spec file: definition:
#     {$text: ./orders.openapi.yaml}.
#   - Resources of type data-asset (label sdd-studio/data-classification: public, internal,
#     confidential or restricted), network, artifact, repository, platform and infrastructure.
#     Components and resources depend on the data assets they use and the networks they run in.
#   - Networks: sdd-studio/trust-zone (threat model file#trust zone id) and sdd-studio/cidr; a
#     network's parent is the first network it depends on.
#   - Artifacts: sdd-studio/artifact-type, sdd-studio/purl, sdd-studio/produced-by (entity
#     reference, component, system, team or repository) and sdd-studio/supplier.
#   - Code: sdd-studio/repository (reference of the repository) and sdd-studio/repository-path on
#     components, resources, artifacts, platforms and infrastructure; repositories have
#     sdd-studio/provider, sdd-studio/repository-url and sdd-studio/default-branch. Keep
#     backstage.io/source-location in line with them (url:<repository URL>/tree/<branch>/<path>,
#     /-/tree/ on GitLab).
#   - Deployment: sdd-studio/deployed-on on components and resources (comma-separated entity
#     references) points to Resources of type platform or infrastructure they run on.
#     sdd-studio/site on networks, platforms and infrastructure points to a Resource of type site (a
#     cloud region or physical location, with sdd-studio/cloud-provider and sdd-studio/region).
# - Keep this header and the existing comments.

# Software catalog of the online shop (Backstage format).
# Register this file in Backstage, or open it with SDD Studio to edit it as a form.
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: commerce
  title: Commerce
  description: Everything customers use to find and buy products.
spec:
  owner: checkout-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: online-shop
  title: Online shop
  description: Customers browse the catalog and pay for their orders by card.
  tags:
    - checkout
    - pci
  annotations:
    sdd-studio/threat-models: ../threat-models/online-shop.otm.yaml
spec:
  owner: checkout-team
  domain: commerce
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: shop-api
  title: Shop API
  description: Orders, payments and the product catalog.
  annotations:
    sdd-studio/specs: ../specs/payment-service.spec.md, ../features/shop.feature
    sdd-studio/repository: shop-repo
    sdd-studio/repository-path: services/shop-api
    sdd-studio/deployed-on: prod-eks-cluster
    backstage.io/source-location: url:https://gitlab.com/acme/shop/-/tree/main/services/shop-api/
spec:
  type: service
  lifecycle: production
  owner: checkout-team
  system: online-shop
  providesApis:
    - petstore-api
    - order-events
  dependsOn:
    - resource:orders-db
    - resource:card-data
    - resource:private
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: deploy-cli
  title: Deploy CLI
  description: Command line tool deploying the shop to the clusters.
  annotations:
    sdd-studio/repository: shop-repo
    sdd-studio/repository-path: tools/deploy
    backstage.io/source-location: url:https://gitlab.com/acme/shop/-/tree/main/tools/deploy/
spec:
  type: cli
  lifecycle: experimental
  owner: platform-team
  system: online-shop
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: petstore-api
  title: Petstore API
spec:
  type: openapi
  lifecycle: production
  owner: checkout-team
  system: online-shop
  definition:
    $text: ../api/petstore.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: order-events
  title: Order events
spec:
  type: asyncapi
  lifecycle: production
  owner: checkout-team
  system: online-shop
  definition:
    $text: ../api/order-events.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: orders-db
  title: Orders database
  annotations:
    sdd-studio/deployed-on: db-host
spec:
  type: database
  owner: checkout-team
  system: online-shop
  dependsOn:
    - resource:private
    - resource:postgres-image
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: card-data
  title: Card data
  description: Card numbers and expiry dates, tokenized before storage.
  labels:
    sdd-studio/data-classification: restricted
spec:
  type: data-asset
  owner: checkout-team
  system: online-shop
  dependsOn:
    - resource:orders-db
---
# Networks stand for the trust zones of the threat model.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: internet
  title: Internet
  description: Anything outside our network.
  annotations:
    sdd-studio/trust-zone: ../threat-models/online-shop.otm.yaml#internet
spec:
  type: network
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: private
  title: Private network
  annotations:
    sdd-studio/trust-zone: ../threat-models/online-shop.otm.yaml#private
    sdd-studio/cidr: 10.20.0.0/16
spec:
  type: network
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: shop-repo
  title: Shop repository
  description: Monorepo of the shop services and tools.
  annotations:
    sdd-studio/provider: gitlab
    sdd-studio/repository-url: https://gitlab.com/acme/shop
    sdd-studio/default-branch: main
spec:
  type: repository
  owner: checkout-team
  system: online-shop
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: shop-api-image
  title: Shop API image
  annotations:
    sdd-studio/artifact-type: container-image
    sdd-studio/purl: pkg:docker/acme/shop-api
    sdd-studio/produced-by: shop-api
    sdd-studio/repository: shop-repo
    sdd-studio/repository-path: services/shop-api
    backstage.io/source-location: url:https://gitlab.com/acme/shop/-/tree/main/services/shop-api/
spec:
  type: artifact
  owner: checkout-team
  system: online-shop
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: postgres-image
  title: PostgreSQL image
  annotations:
    sdd-studio/artifact-type: container-image
    sdd-studio/purl: pkg:docker/library/postgres@16
    sdd-studio/supplier: PostgreSQL Global Development Group
spec:
  type: artifact
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: deploy-cli-image
  title: Deploy CLI image
  annotations:
    sdd-studio/artifact-type: container-image
    sdd-studio/purl: pkg:docker/acme/deploy-cli
    sdd-studio/produced-by: resource:shop-repo
spec:
  type: artifact
  owner: platform-team
  system: online-shop
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: prod-eks-cluster
  title: Prod EKS cluster
  description: Kubernetes cluster running the shop's services.
  annotations:
    sdd-studio/site: aws-us-east-1
spec:
  type: platform
  owner: platform-team
  system: online-shop
  dependsOn:
    - resource:private
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: db-host
  title: Orders DB host
  description: VM running the orders database.
  annotations:
    sdd-studio/site: aws-us-east-1
spec:
  type: infrastructure
  owner: platform-team
  system: online-shop
  dependsOn:
    - resource:private
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: aws-us-east-1
  title: AWS us-east-1
  annotations:
    sdd-studio/cloud-provider: aws
    sdd-studio/region: us-east-1
spec:
  type: site
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: checkout-team
  title: Checkout team
spec:
  type: team
  profile:
    email: checkout@example.com
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  title: Platform team
spec:
  type: team
  children: []
