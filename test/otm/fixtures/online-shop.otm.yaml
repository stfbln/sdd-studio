# Threat model of the online shop checkout (Open Threat Model 0.2.0).
otmVersion: 0.2.0
project:
  name: Online shop
  id: online-shop
  description: Customers browse the catalog and pay for their orders by card.
  owner: Checkout team
  ownerContact: checkout@example.com
  tags:
    - checkout
    - pci
  attributes:
    cmdbId: SHOP-042

representations:
  - name: Architecture diagram
    id: architecture-diagram
    type: diagram
    size:
      width: 1200
      height: 800

trustZones:
  - name: Internet
    id: internet
    type: internet
    description: Anything outside our network.
    risk:
      trustRating: 10
  - name: Private network
    id: private
    type: private
    risk:
      trustRating: 90

components:
  - name: Browser
    id: browser
    type: web-client
    parent:
      trustZone: internet
    representations:
      - representation: architecture-diagram
        id: browser-shape
        position:
          x: 40
          y: 60
        size:
          width: 120
          height: 80
  - name: Shop API
    id: shop-api
    type: web-service
    description: Handles the cart, orders and payments.
    parent:
      trustZone: private
    tags:
      - node
    assets:
      processed:
        - card-data
        - customer-data
    threats:
      - threat: card-data-leak
        state: exposed
        mitigations:
          - mitigation: tokenize-cards
            state: required
      - threat: session-hijacking
        state: mitigated
        mitigations:
          - mitigation: secure-cookies
            state: implemented
  - name: Orders database
    id: orders-db
    type: database
    parent:
      trustZone: private
    assets:
      stored:
        - customer-data
    threats:

dataflows:
  - name: Checkout requests
    id: browser-to-api
    bidirectional: true
    source: browser
    destination: shop-api
    assets:
      - card-data
    threats:
      - threat: session-hijacking
        state: mitigated
  - name: Order storage
    id: api-to-db
    source: shop-api
    destination: orders-db
    assets:
      - customer-data

assets:
  - name: Card data
    id: card-data
    description: Card numbers and security codes typed at checkout.
    risk:
      confidentiality: 100
      integrity: 90
      availability: 60
      comment: PCI DSS scope.
  - name: Customer data
    id: customer-data
    description: Names, addresses and order history.
    risk:
      confidentiality: 70
      integrity: 70
      availability: 50

threats:
  - name: Card data leak
    id: card-data-leak
    description: An attacker reads card numbers from logs or memory dumps of the API.
    categories:
      - Information Disclosure
    cwes:
      - CWE-532
    risk:
      likelihood: 40
      likelihoodComment: Needs access to the private network.
      impact: 100
      impactComment: Card data exposure means fines and loss of trust.
  - name: Session hijacking
    id: session-hijacking
    categories:
      - Spoofing
    cwes:
      - CWE-384
    risk:
      likelihood: 50
      impact: 70

mitigations:
  - name: Tokenize cards at the payment provider
    id: tokenize-cards
    description: Card numbers never reach our servers.
    riskReduction: 90
  - name: Secure, HTTP-only cookies
    id: secure-cookies
    riskReduction: 70
